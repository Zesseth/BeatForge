name: privacy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-audio-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Static linter (no-audio-egress)
        run: python tools/static_no_audio_egress.py
      - name: Pytest — no-network sandbox
        run: pytest -m no_network -q
      - name: Pytest — privacy harness
        run: pytest tests/privacy -q
