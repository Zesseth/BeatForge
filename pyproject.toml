[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatforge"
version = "0.1.0"
description = "BeatForge drum MIDI generator"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
drumgen = "drumgen.cli:main"

[tool.setuptools.packages.find]
include = ["drumgen*"]
