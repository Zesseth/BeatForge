[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beatforge"
version = "0.1.0.dev0"
description = "Privacy-first, prompt-driven drum MIDI generator for REAPER and other DAWs."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "BeatForge contributors" }]
keywords = ["midi", "drums", "reaper", "audio", "music", "generation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mido>=1.3.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
drumgen = "beatforge.cli.main:app"

[project.urls]
Homepage = "https://github.com/Zesseth/BeatForge"
Issues = "https://github.com/Zesseth/BeatForge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"beatforge" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["mido", "mido.*"]
ignore_missing_imports = true
